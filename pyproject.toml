[project]
name = "cyfryzacja-formularzy"
version = "1.0.0"
description = "Rozwiązanie zadania COI na HackNation 2026"
readme = "README.md"
authors = [{ name = "zakhildev", email = "piotr.blecharski02@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "olefile>=0.47",
    "opencv-python-headless>=5.1.0.95",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.11",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hacknation-2026 = "hacknation_2026:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hacknation_2026"

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.2.0"]
